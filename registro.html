<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Mil Plumas, Una Historia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="libro-marco">
    <div id="header"></div>

    <div class="columns is-centered">
        <div class="column is-6">
            <div class="caja-verde-formulario has-text-centered">
                <h2 class="hero-titulo is-size-2 mb-4">Crear cuenta</h2>
                <form id="form-registro" onsubmit="procesarRegistro(event)">
                    <div class="field has-text-left mb-3">
                        <label class="label label-cursivo" for="reg-usuario">Nombre de usuario *</label>
                        <div class="control">
                            <input id="reg-usuario" class="input input-estilo" type="text" name="nombre_usuario" placeholder="Crea tu nombre de usuario" required>
                        </div>
                    </div>
                    <div class="field has-text-left mb-3">
                        <label class="label label-cursivo" for="reg-correo">Correo *</label>
                        <div class="control">
                            <input id="reg-correo" class="input input-estilo" type="email" name="correo" placeholder="ejemplo@gmail.com" required>
                        </div>
                    </div>
                    <div class="field has-text-left mb-4">
                        <label class="label label-cursivo" for="reg-pass">Contraseña * (8 caracteres)</label>
                        <div class="control">
                            <input id="reg-pass" class="input input-estilo" type="password" name="contrasena" placeholder="ejemplo2345@" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primario">Registrarse</button>
                    <div class="mt-4">
                        <a href="login.html" class="is-block link-cursivo is-size-5">¿Ya tienes una cuenta? Inicia Sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/registro.js"></script>
<script>
fetch("header.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById("header").innerHTML = data;
    });

fetch("footer.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById("footer").innerHTML = data;
    });
</script>
</body>
</html>
